<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BitNova – Bejelentkezés</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Syne:wght@800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --navy: #0B1F3A;
            --navy-mid: #132847;
            --accent: #1E8FFF;
            --accent-light: #5AB3FF;
            --accent-pale: #E8F4FF;
            --teal: #00C9A7;
            --text: #1A2940;
            --text-mid: #3D5575;
            --text-light: #6B88A8;
            --border: #D4E3F0;
            --bg: #F7FAFD;
            --white: #FFFFFF;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--navy);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* Háttér grid ugyanaz mint a hero-n */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(30,143,255,0.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(30,143,255,0.06) 1px, transparent 1px);
            background-size: 48px 48px;
            pointer-events: none;
        }

        body::after {
            content: '';
            position: fixed;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(30,143,255,0.15) 0%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        .login-container {
            background: rgba(255,255,255,0.97);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            box-shadow: 0 32px 64px rgba(0,0,0,0.25);
            padding: 2.75rem;
            width: 100%;
            max-width: 420px;
            position: relative;
            z-index: 1;
            animation: slideIn 0.6s ease-out;
            border: 1px solid rgba(255,255,255,0.15);
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(30px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* LOGO */
        .logo {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo-text {
            font-family: 'Syne', sans-serif;
            font-weight: 800;
            font-size: 2rem;
            color: var(--navy);
            letter-spacing: -0.5px;
            display: block;
            margin-bottom: 0.4rem;
            text-decoration: none;
        }
        .logo-text span { color: var(--accent); }

        .logo p {
            color: var(--text-light);
            font-size: 0.92rem;
        }

        /* DIVIDER */
        .logo-divider {
            height: 1px;
            background: var(--border);
            margin: 0 0 2rem 0;
        }

        /* FORM GROUPS */
        .form-group {
            margin-bottom: 1.25rem;
            position: relative;
            animation: slideIn 0.6s ease-out both;
        }
        .form-group:nth-child(1) { animation-delay: 0.1s; }
        .form-group:nth-child(2) { animation-delay: 0.2s; }
        .form-group:nth-child(3) { animation-delay: 0.3s; }

        .form-group label {
            display: block;
            margin-bottom: 0.4rem;
            color: var(--text-mid);
            font-weight: 500;
            font-size: 0.82rem;
        }

        .form-group input {
            width: 100%;
            padding: 0.85rem 1rem;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.95rem;
            color: var(--text);
            background: var(--bg);
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
        }

        .form-group input:hover { border-color: var(--accent-light); }

        .form-group input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(30,143,255,0.12);
            background: var(--white);
        }

        .password-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(30%);
            cursor: pointer;
            color: var(--text-light);
            font-size: 1.1rem;
            user-select: none;
            transition: color 0.2s;
        }
        .password-toggle:hover { color: var(--accent); }

        /* OPTIONS ROW */
        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            font-size: 0.88rem;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-mid);
            cursor: pointer;
        }

        .remember-me input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--accent);
        }

        .forgot-password {
            color: var(--accent);
            text-decoration: none;
            font-weight: 500;
            cursor: pointer;
            transition: color 0.2s;
        }
        .forgot-password:hover { color: var(--navy); text-decoration: underline; }

        /* LOGIN BUTTON */
        .login-btn {
            width: 100%;
            padding: 0.9rem;
            background: var(--navy);
            color: var(--white);
            border: none;
            border-radius: 10px;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
            margin-bottom: 1.5rem;
        }
        .login-btn:hover {
            background: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(30,143,255,0.3);
        }
        .login-btn:active { transform: translateY(0); }
        .login-btn:disabled {
            opacity: 0.65;
            cursor: not-allowed;
            transform: none;
        }

        /* MESSAGES */
        .error-message {
            background: #FFF0F0;
            color: #C53030;
            border: 1px solid #FEB2B2;
            padding: 0.75rem 1rem;
            border-radius: 10px;
            margin-bottom: 1.25rem;
            font-size: 0.88rem;
            display: none;
        }

        .success-message {
            background: #E0FAF5;
            color: #0F6E56;
            border: 1px solid #9AE6D4;
            padding: 0.75rem 1rem;
            border-radius: 10px;
            margin-bottom: 1.25rem;
            font-size: 0.88rem;
            display: none;
        }

        /* REGISTER LINK */
        .register-link {
            text-align: center;
            color: var(--text-light);
            font-size: 0.85rem;
            line-height: 1.6;
        }

        .register-link a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 500;
        }
        .register-link a:hover { text-decoration: underline; }

        /* BACK LINK */
        .back-link {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-top: 1.5rem;
            color: var(--text-light);
            font-size: 0.85rem;
            text-decoration: none;
            transition: color 0.2s;
        }
        .back-link:hover { color: var(--navy); }

        @media (max-width: 480px) {
            .login-container { padding: 2rem 1.5rem; }
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="logo">
            <a href="/" class="logo-text">Bit<span>Nova</span></a>
            <p>Jelentkezzen be fiókjába</p>
        </div>

        <div class="logo-divider"></div>

        <div class="error-message" id="errorMessage"></div>
        <div class="success-message" id="successMessage"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">E-mail cím</label>
                <input type="email" id="email" name="email" autocomplete="email" required placeholder="pelda@email.com">
            </div>

            <div class="form-group">
                <label for="password">Jelszó</label>
                <input type="password" id="password" name="password" autocomplete="password" required placeholder="Írja be jelszavát">
                <span class="password-toggle" onclick="togglePassword()">👁️</span>
            </div>

            <div class="form-options">
                <label class="remember-me">
                    <input type="checkbox" id="remember" name="remember">
                    <span>Emlékezzen rám</span>
                </label>
                <span class="forgot-password" onclick="forgotPassword()">Elfelejtett jelszó?</span>
            </div>

            <button type="submit" class="login-btn" id="loginBtn">
                Bejelentkezés
            </button>
        </form>

        <div class="register-link">
            Ha hibába ütközik vegye fel velünk a kapcsolatot: <a href="mailto:info@bitnova.hu">info@bitnova.hu</a>
        </div>

        <a href="/" class="back-link">← Vissza a főoldalra</a>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

    <script>
        // Firebase konfiguráció - CSERÉLD KI A SAJÁT ÉRTÉKEIDDEL!
          const firebaseConfig = {
            apiKey: "AIzaSyAXnAo-7BF6iKjNzYr0uoJbhlpCWNaS9s4",
            authDomain: "bitnova-backend.firebaseapp.com",
            projectId: "bitnova-backend",
            storageBucket: "bitnova-backend.firebasestorage.app",
            messagingSenderId: "312941837204",
            appId: "1:312941837204:web:f6e3ff0d44cab13f30ed81",
            measurementId: "G-VBW8LX8LDE"
          };
        
        // Firebase inicializálása
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        // Bejelentkezés perzisztencia beállítása
        auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);

        // Jelszó mutatása/elrejtése
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const toggleBtn = document.querySelector('.password-toggle');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleBtn.textContent = '🙈';
            } else {
                passwordInput.type = 'password';
                toggleBtn.textContent = '👁️';
            }
        }

        // Bejelentkezési form kezelése
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const remember = document.getElementById('remember').checked;
            
            // Validáció
            if (!email || !password) {
                showError('Kérjük, töltse ki az összes mezőt!');
                return;
            }
            
            if (!isValidEmail(email)) {
                showError('Kérjük, adjon meg érvényes e-mail címet!');
                return;
            }
            
            performLogin(email, password, remember);
        });

        // Firebase bejelentkezés
        async function performLogin(email, password, remember) {
            const loginBtn = document.getElementById('loginBtn');
            
            try {
                // Gomb letiltása és betöltés jelzése
                loginBtn.disabled = true;
                loginBtn.textContent = 'Bejelentkezés...';
                
                // Perzisztencia beállítása a "Emlékezzen rám" alapján
                const persistence = remember ? 
                    firebase.auth.Auth.Persistence.LOCAL : 
                    firebase.auth.Auth.Persistence.SESSION;
                
                await auth.setPersistence(persistence);
                
                // Bejelentkezés Firebase-zel
                const userCredential = await auth.signInWithEmailAndPassword(email, password);
                // Ha be van pipálva az "Emlékezzen rám", mentsd el az email címet
                if (remember) {
                    localStorage.setItem('rememberedEmail', email);
                } else {
                    localStorage.removeItem('rememberedEmail');
                }
                const user = userCredential.user;
                
                showSuccess('Sikeres bejelentkezés! Átirányítás...');
                
                // Átirányítás
                setTimeout(() => {
                    window.location.href = 'dashboard.html'; // Cseréld ki a saját útvonalra
                }, 1500);
                
            } catch (error) {
                console.error('Bejelentkezési hiba:', error);
                handleAuthError(error);
                resetLoginButton();
            }
        }

        

        // Elfelejtett jelszó
        async function forgotPassword() {
            const email = document.getElementById('email').value;
            
            if (!email) {
                showError('Kérjük, adja meg az e-mail címét először!');
                return;
            }
            
            if (!isValidEmail(email)) {
                showError('Kérjük, adjon meg érvényes e-mail címet!');
                return;
            }
            
            try {
                await auth.sendPasswordResetEmail(email);
                showSuccess('Jelszó visszaállítási e-mail elküldve! Ellenőrizze postafiókját.');
            } catch (error) {
                console.error('Jelszó visszaállítási hiba:', error);
                handleAuthError(error);
            }
        }


        // Auth hibák kezelése
        function handleAuthError(error) {
            let message = 'Ismeretlen hiba történt.';
            
            switch (error.code) {
                case 'auth/user-not-found':
                    message = 'Nem található felhasználó ezzel az e-mail címmel.';
                    break;
                case 'auth/wrong-password':
                    message = 'Hibás jelszó.';
                    break;
                case 'auth/invalid-email':
                    message = 'Érvénytelen e-mail cím.';
                    break;
                case 'auth/user-disabled':
                    message = 'Ez a fiók le van tiltva.';
                    break;
                case 'auth/too-many-requests':
                    message = 'Túl sok sikertelen kísérlet. Próbálja újra később.';
                    break;
                case 'auth/network-request-failed':
                    message = 'Hálózati hiba. Ellenőrizze internetkapcsolatát.';
                    break;
                case 'auth/popup-closed-by-user':
                    message = 'Bejelentkezési ablak bezárva.';
                    break;
                case 'auth/popup-blocked':
                    message = 'Popup ablak blokkolva. Engedélyezze a popup-okat.';
                    break;
                default:
                    message = error.message || 'Bejelentkezési hiba történt.';
            }
            
            showError(message);
        }

        // Hibaüzenet megjelenítése
        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            document.getElementById('successMessage').style.display = 'none';
        }

        // Sikeres üzenet megjelenítése
        function showSuccess(message) {
            const successDiv = document.getElementById('successMessage');
            successDiv.textContent = message;
            successDiv.style.display = 'block';
            document.getElementById('errorMessage').style.display = 'none';
        }

        // E-mail validáció
        function isValidEmail(email) {
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return emailRegex.test(email);
        }

        // Bejelentkezés gomb visszaállítása
        function resetLoginButton() {
            const loginBtn = document.getElementById('loginBtn');
            loginBtn.disabled = false;
            loginBtn.textContent = 'Bejelentkezés';
        }

        // Auth állapot figyelése
        auth.onAuthStateChanged((user) => {
            if (user) {
                // Felhasználó be van jelentkezve
                console.log('Felhasználó bejelentkezve:', user.email);
                // Itt átirányíthatod a dashboard-ra, ha már be van jelentkezve
                // window.location.href = '/dashboard.html';
            } else {
                // Felhasználó nincs bejelentkezve
                console.log('Felhasználó nincs bejelentkezve');
            }
        });

        // Enter billentyű kezelése
        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('loginForm').dispatchEvent(new Event('submit'));
            }
        });

        // Bejelentkezés után a bejelentkezes.html-ben:
        firebase.auth().signInWithEmailAndPassword(email, password)
          .then((userCredential) => {
            // Sikeres bejelentkezés
            window.location.href = 'dashboard.html?login=success';
          })
          .catch((error) => {
            // Hibakezelés
          });

        // Oldal betöltésekor ellenőrizd, van-e mentett email
        window.addEventListener('DOMContentLoaded', function() {
            const rememberedEmail = localStorage.getItem('rememberedEmail');
            if (rememberedEmail) {
                document.getElementById('email').value = rememberedEmail;
                document.getElementById('remember').checked = true;
            }
        });
    </script>
</body>
</html>
